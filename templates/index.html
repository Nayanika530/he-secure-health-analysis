<!DOCTYPE html>
<html>
<head>
    <title>HE Secure Diabetes Risk Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        label { display: block; margin-bottom: 8px; }
        input { width: 100px; margin-left: 10px; }
        button { margin-top: 15px; padding: 8px 20px; }
        .badge { padding: 4px 10px; border-radius: 4px; color: white; font-size: 0.85em; }
        .exposed { background: #d9534f; }
        .protected { background: #5cb85c; }
        #chartContainer { max-width: 400px; margin-top: 25px; }
    </style>
</head>
<body>
    <h1>Homomorphic Encryption Demo — Diabetes Risk</h1>
    <form id="patientForm">
        {% for f in features %}
        <label>{{ f }}: <input type="number" step="any" name="{{ f }}" required></label>
        {% endfor %}
        <button type="submit">Run Analysis</button>
    </form>

    <div id="results" style="margin-top:20px;"></div>
    <div id="chartContainer"><canvas id="resultChart"></canvas></div>

    <script>
        let chart;
        document.getElementById("patientForm").addEventListener("submit", async function(e) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const response = await fetch("/predict", {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            document.getElementById("results").innerHTML = `
                <p><span class="badge exposed">DATA EXPOSED</span> Traditional Approach: ${result.traditional_probability}</p>
                <p><span class="badge protected">DATA PROTECTED</span> HE Approach: ${result.he_probability}</p>
            `;

            const ctx = document.getElementById("resultChart").getContext("2d");
            if (chart) chart.destroy();
            chart = new Chart(ctx, {
                type: "bar",
                data: {
                    labels: ["Traditional (exposed)", "HE (encrypted)"],
                    datasets: [{
                        label: "Diabetes Risk Probability",
                        data: [result.traditional_probability, result.he_probability],
                        backgroundColor: ["#d9534f", "#5cb85c"]
                    }]
                },
                options: {
                    scales: { y: { beginAtZero: true, max: 1 } }
                }
            });
        });
    </script>
</body>
</html>
