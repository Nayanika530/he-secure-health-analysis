<!DOCTYPE html>
<html>
<head>
    <title>HE Secure Health Analysis</title>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/4.4.0/chart.umd.min.js"></script>
    <style>
        body { font-family: Arial, sans-serif; max-width: 700px; margin: 40px auto; }
        label { display: block; margin-bottom: 8px; }
        input, select { margin-left: 10px; }
        button { margin-top: 15px; padding: 8px 20px; }
        .badge { padding: 4px 10px; border-radius: 4px; color: white; font-size: 0.85em; }
        .exposed { background: #d9534f; }
        .protected { background: #5cb85c; }
        #chartContainer { max-width: 400px; margin-top: 25px; }
        .model-form { display: none; }
        .model-form.active { display: block; }
    </style>
</head>
<body>
    <h1>Homomorphic Encryption Demo — Health Risk Analysis</h1>

    <label>Choose a model:
        <select id="modelSelect">
            <option value="diabetes">Diabetes Risk</option>
            <option value="cardio">Cardiovascular Risk</option>
            <option value="phq9">PHQ-9 Depression Screener</option>
        </select>
    </label>

    <form id="diabetesForm" class="model-form active">
        {% for f in diabetes_features %}
        <label>{{ f }}: <input type="number" step="any" name="{{ f }}" required></label>
        {% endfor %}
        <button type="submit">Run Analysis</button>
    </form>

    <form id="cardioForm" class="model-form">
        {% for f in cardio_features %}
        <label>{{ f }}: <input type="number" step="any" name="{{ f }}" required></label>
        {% endfor %}
        <button type="submit">Run Analysis</button>
    </form>

    <form id="phq9Form" class="model-form">
        {% for q in phq9_questions %}
        <label>{{ q }}:
            <select name="q{{ loop.index0 }}">
                <option value="0">Not at all</option>
                <option value="1">Several days</option>
                <option value="2">More than half the days</option>
                <option value="3">Nearly every day</option>
            </select>
        </label>
        {% endfor %}
        <button type="submit">Run Analysis</button>
    </form>

    <div id="results" style="margin-top:20px;"></div>
    <div id="chartContainer"><canvas id="resultChart"></canvas></div>

    <script>
        const modelSelect = document.getElementById("modelSelect");
        const forms = {
            diabetes: document.getElementById("diabetesForm"),
            cardio: document.getElementById("cardioForm"),
            phq9: document.getElementById("phq9Form")
        };

        modelSelect.addEventListener("change", () => {
            Object.values(forms).forEach(f => f.classList.remove("active"));
            forms[modelSelect.value].classList.add("active");
            document.getElementById("results").innerHTML = "";
            if (chart) { chart.destroy(); chart = null; }
        });

        let chart;

        async function handleSubmit(e, endpoint) {
            e.preventDefault();
            const formData = new FormData(e.target);
            const data = Object.fromEntries(formData.entries());

            const response = await fetch(endpoint, {
                method: "POST",
                headers: { "Content-Type": "application/json" },
                body: JSON.stringify(data)
            });
            const result = await response.json();

            if (result.type === "probability") {
                document.getElementById("results").innerHTML = `
                    <p><span class="badge exposed">DATA EXPOSED</span> Traditional Approach: ${result.traditional_probability}</p>
                    <p><span class="badge protected">DATA PROTECTED</span> HE Approach: ${result.he_probability}</p>
                `;
                const ctx = document.getElementById("resultChart").getContext("2d");
                if (chart) chart.destroy();
                chart = new Chart(ctx, {
                    type: "bar",
                    data: {
                        labels: ["Traditional (exposed)", "HE (encrypted)"],
                        datasets: [{
                            label: "Risk Probability",
                            data: [result.traditional_probability, result.he_probability],
                            backgroundColor: ["#d9534f", "#5cb85c"]
                        }]
                    },
                    options: { scales: { y: { beginAtZero: true, max: 1 } } }
                });
            } else if (result.type === "phq9") {
                document.getElementById("results").innerHTML = `
                    <p><span class="badge protected">DATA PROTECTED</span> PHQ-9 Score: ${result.score}/27 — ${result.band}</p>
                    <p>This score was computed while your individual answers remained encrypted.</p>
                `;
                if (chart) { chart.destroy(); chart = null; }
            }
        }

        forms.diabetes.addEventListener("submit", e => handleSubmit(e, "/predict/diabetes"));
        forms.cardio.addEventListener("submit", e => handleSubmit(e, "/predict/cardio"));
        forms.phq9.addEventListener("submit", e => handleSubmit(e, "/predict/phq9"));
    </script>
</body>
</html>
